<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoldDrop - Кейсы Standoff 2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            font-family: Arial, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            text-align: center;
            padding: 30px;
            max-width: 400px;
        }
        .logo {
            font-size: 48px;
            font-weight: bold;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .case-box {
            background: #1a1a3e;
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 30px;
            margin: 30px 0;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.2);
        }
        .case-box h2 { font-size: 22px; margin-bottom: 10px; }
        .case-box p { color: #aaa; font-size: 14px; margin-bottom: 20px; }
        .btn {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border: none;
            padding: 15px 50px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            color: #000;
            transition: 0.3s;
        }
        .btn:hover { transform: scale(1.05); }
        .balance {
            margin-top: 20px;
            padding: 15px;
            background: #111;
            border-radius: 10px;
            color: #888;
            font-size: 16px;
        }
        .balance span { color: #ffd700; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🎰 GoldDrop</div>
        <p style="margin:10px 0 0; color:#888;">Открывай кейсы Standoff 2</p>
        <div class="case-box">
            <h2>🔴 Кейс «Золотой Дракон»</h2>
           <img src="https://raw.githubusercontent.com/tarkoevmm-afk/GoldDrop/main/standoff.png" style="width:120px; border-radius:15px; margin:10px 0; border:2px solid #ffd700;">
            
           <p>Шанс на выпадение редкого скина: <strong>5%</strong></p>
            <button class="btn">Открыть за 50 ₽</button>
        </div>
        <div class="balance">
            💰 Баланс: <span>100 ₽</span> &nbsp;|&nbsp; 🆔 ID: <span>tarkoevmm-afk</span>
        </div>
        <p style="margin-top:20px; font-size:12px; color:#444;">GoldDrop - лучший сайт для открытия кейсов Standoff 2</p>
    </div>
</body>
</html>
