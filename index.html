<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoldDrop 4.0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a1a;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 0;
        }
        .container {
            text-align: center;
            padding: 20px;
            max-width: 480px;
            width: 100%;
        }
        .logo {
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }
        .tabs {
            display: flex;
            gap: 6px;
            margin: 15px auto;
            background: #1a1a2e;
            border-radius: 20px;
            padding: 6px;
            border: 1px solid #2a2a4a;
            justify-content: center;
            max-width: 460px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: #888;
            padding: 12px 14px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 14px;
            flex: 1;
            min-width: 55px;
            transition: 0.3s;
            text-align: center;
            white-space: nowrap;
        }
        .tab-btn.active {
            background: #ffd700;
            color: #000;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
            transform: scale(1.05);
        }
        .tab-btn:hover {
            color: #fff;
            background: rgba(255, 215, 0, 0.1);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .cases-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        .case-card {
            background: #1a1a3e;
            border: 2px solid #2a2a5e;
            border-radius: 20px;
            padding: 16px 10px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 260px;
            justify-content: space-between;
        }
        .case-card:hover {
            transform: scale(1.06);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.3);
            border-color: #ffd700;
        }
        .case-card .case-avatar {
            width: 200px;
            height: 200px;
            object-fit: contain;
            border-radius: 16px;
            margin: 0 auto 6px;
            display: block;
            background: #0f0f1a;
            padding: 6px;
            border: 2px solid #2a2a5e;
        }
        .case-card .name {
            font-size: 15px;
            color: #fff;
            font-weight: bold;
            text-align: center;
            min-height: 36px;
            line-height: 1.2;
            margin: 2px 0;
        }
        .case-card .price {
            font-size: 15px;
            color: #ffd700;
            font-weight: bold;
        }
        .case-card .chance {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
        }
        .section-title {
            font-size: 22px;
            font-weight: bold;
            color: #ffd700;
            margin: 28px 0 16px 0;
            text-align: left;
            padding-left: 16px;
            border-left: 4px solid #ffd700;
        }
        .section-title .sub {
            font-size: 15px;
            color: #888;
            font-weight: normal;
        }
        .profile-card {
            background: #1a1a3e;
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 20px;
            margin: 15px 0;
        }
        .profile-card .id {
            color: #888;
            font-size: 14px;
        }
        .profile-card .id span {
            color: #ffd700;
            font-weight: bold;
        }
        .profile-card .balance {
            font-size: 22px;
            color: #ffd700;
            margin: 10px 0;
        }
        .footer {
            margin-top: 20px;
            font-size: 11px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🎰 GoldDrop 4.0</div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="cases">🏠 Кейсы</button>
            <button class="tab-btn" data-tab="profile">👤 Профиль</button>
        </div>

        <div id="tab-cases" class="tab-content active">
            <div class="section-title">🏝️ Проклятый остров <span class="sub">— 6 кейсов</span></div>
            <div class="cases-grid" id="mainCases"></div>
        </div>

        <div id="tab-profile" class="tab-content">
            <div class="profile-card">
                <div class="id">🆔 ID: <span id="playerId">Гость</span></div>
                <div class="balance">💰 Баланс: <span id="balanceDisplay">100</span> Gold</div>
            </div>
        </div>

        <div class="footer">GoldDrop 4.0 — лучший портал для Standoff 2</div>
    </div>

    <script>
        const caseRows = {
            main: [
                { name: "Райское извержение", price: 19, emoji: "🌋", chance: 8, avatar: "https://i.ibb.co/39LSMCG1/IMG-1403.jpg" },
                { name: "Розовый оазис", price: 39, emoji: "🌺", chance: 8, avatar: "https://i.ibb.co/CpY181tP/IMG-1405.jpg" },
                { name: "Гавайский отдых", price: 59, emoji: "🏝️", chance: 7, avatar: "https://i.ibb.co/bgbRGBz5/IMG-1406.jpg" },
                { name: "Ядовитая флора", price: 99, emoji: "☠️", chance: 7, avatar: "https://i.ibb.co/xKkFh1qt/IMG-1408.jpg" },
                { name: "Тропическое наслаждение", price: 199, emoji: "🌴", chance: 6, avatar: "https://i.ibb.co/WvTnTsbw/IMG-1409.jpg" },
                { name: "Гнев тики", price: 399, emoji: "🗿", chance: 6, avatar: "https://i.ibb.co/Q7gZhgtz/IMG-1410.jpg" }
            ]
        };

        let balance = 100;

        function renderCaseRow(containerId, casesArray) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';
            casesArray.forEach((c) => {
                const card = document.createElement('div');
                card.className = 'case-card';
                card.innerHTML = `
                        <img src="${c.avatar}" alt="${c.name}" class="case-avatar">
                        <div class="name">${c.name}</div>
                        <div class="price">💰 ${c.price} Gold</div>
                        <div class="chance">Шанс: ${c.chance}%</div>
                    `;
                container.appendChild(card);
            });
        }

        function renderAllCases() {
            renderCaseRow('mainCases', caseRows.main);
        }

        renderAllCases();
        document.getElementById('balanceDisplay').textContent = balance;

        console.log('✅ GoldDrop 4.0 загружен!');

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                document.getElementById('tab-' + this.dataset.tab).classList.add('active');
            });
        });
    </script>
</body>
</html>
