<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GoldDrop НОВЫЙ</title>
<style>
body{background:#0a0a1a;color:#fff;font-family:sans-serif;text-align:center;padding:20px}
.logo{font-size:42px;font-weight:900;background:linear-gradient(135deg,#ffd700,#ff8c00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.cases{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;max-width:480px;margin:auto}
.case{background:#1a1a3e;border:2px solid #ffd700;border-radius:20px;padding:16px}
.case img{width:200px;height:200px;object-fit:contain;border-radius:16px;display:block;margin:auto}
.case .name{color:#fff;margin:5px 0}
.case .price{color:#ffd700}
</style>
</head>
<body>
<div class="logo">🎰 GoldDrop 4.0 — НОВЫЙ</div>
<div class="cases">
<div class="case"><img src="https://i.ibb.co/39LSMCG1/IMG-1403.jpg"><div class="name">Райское извержение</div><div class="price">💰 19 Gold</div></div>
<div class="case"><img src="https://i.ibb.co/CpY181tP/IMG-1405.jpg"><div class="name">Розовый оазис</div><div class="price">💰 39 Gold</div></div>
<div class="case"><img src="https://i.ibb.co/bgbRGBz5/IMG-1406.jpg"><div class="name">Гавайский отдых</div><div class="price">💰 59 Gold</div></div>
<div class="case"><img src="https://i.ibb.co/xKkFh1qt/IMG-1408.jpg"><div class="name">Ядовитая флора</div><div class="price">💰 99 Gold</div></div>
<div class="case"><img src="https://i.ibb.co/WvTnTsbw/IMG-1409.jpg"><div class="name">Тропическое наслаждение</div><div class="price">💰 199 Gold</div></div>
<div class="case"><img src="https://i.ibb.co/Q7gZhgtz/IMG-1410.jpg"><div class="name">Гнев тики</div><div class="price">💰 399 Gold</div></div>
</div>
</body>
</html>
